name: FaceWall PHP checks

on:
  pull_request:
    paths:
      - 'facewall.php'
      - 'current_list.php'
      - 'membership_list.php'
      - 'officer_grid_year.php'
      - 'poster.php'
      - 'membership_fees.php'
      - 'facewall_cron.php'
      - 'includes/**'
      - 'tests/**'
      - '.github/workflows/facewall-php-checks.yml'
  workflow_dispatch:

jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Check PHP syntax
        run: |
          find . -maxdepth 2 -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run FaceWall regressions
        run: |
          php tests/facewall-regression.php
          php tests/joint-membership-regression.php
          php tests/facewall-security-regression.php
