name: FaceWall history cleanup rehearsal (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facewall-history-cleanup-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    name: Test sensitive-file removal without pushing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out all branches and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true  # read-only GITHUB_TOKEN

      - name: Install git-filter-repo
        run: |
          python3 -m pip install --user git-filter-repo==2.47.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rewrite disposable copy and check affected references
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'speleo/facewall' || "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'This review is only approved for speleo/facewall on main.' >&2
            exit 1
          fi

          # Fetch PR heads for the impact count; GitHub's refs/pull/* are read-only.
          git fetch --no-tags origin '+refs/pull/*/head:refs/pull/*/head'

          # Assemble a disposable bare Git repository from the fetched local refs.
          # No credentials or write access are provided to this bare repository.
          scratch="$RUNNER_TEMP/facewall-history-rehearsal.git"
          git init --bare "$scratch"
          git -C "$scratch" fetch --no-tags "$GITHUB_WORKSPACE" \
            '+refs/remotes/origin/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/pull/*/head'

          branch_count=$(git -C "$scratch" for-each-ref refs/heads --format='%(refname)' | wc -l)
          pr_count=$(git -C "$scratch" for-each-ref refs/pull --format='%(refname)' | wc -l)
          if (( branch_count < 1 )); then
            echo 'No repository branches were copied; refusing an incomplete audit.' >&2
            exit 1
          fi
          echo "Branches analysed: $branch_count"
          echo "Pull-request heads analysed: $pr_count"

          before_count=$(git -C "$scratch" log --all --format='%H' -- \
            zzpluralzalpha/ facewall_cron.txt | wc -l)
          echo "Commits referencing removed paths, before filtering: $before_count"
          if (( before_count < 1 )); then
            echo 'No affected history was found in the available refs; no rewrite needed.'
            exit 0
          fi

          # --force is safe here: the scratch repository is freshly created in
          # RUNNER_TEMP and will be discarded when this workflow completes.
          # --no-fetch is used because branch, tag, and PR-head refs were loaded
          # explicitly into this scratch repository; nothing is pushed.
          git -C "$scratch" filter-repo \
            --force --sensitive-data-removal --no-fetch --invert-paths \
            --path zzpluralzalpha/ \
            --path facewall_cron.txt

          if git -C "$scratch" log --all --format='%H' -- \
              zzpluralzalpha/ facewall_cron.txt | grep -q .; then
            echo 'FAIL: affected paths are still reachable after rewriting.' >&2
            exit 1
          fi

          ref_report="$scratch/filter-repo/changed-refs"
          if [[ -f "$ref_report" ]]; then
            changed_pr_count=$(grep -Ec '^refs/pull/.*/head$' "$ref_report" || true)
            changed_branch_count=$(grep -Ec '^refs/heads/' "$ref_report" || true)
            echo "Pull requests whose heads would change: $changed_pr_count"
            echo "Branches whose heads would change: $changed_branch_count"
          fi
          echo 'PASS: removed paths are absent from all fetched rewritten references.'
          echo 'No repository branches, tags, pull requests, or files were pushed or changed.'
